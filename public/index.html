<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD Flashcards</title>

<!-- Home-screen icon + PWA metadata -->
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" href="/icon-32.png" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<meta name="theme-color" content="#4f6ef7" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Flashcards" />

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f4f5f7;
    color: #1a1d2e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 20px;
  }

  h1 {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #a0a8be;
    margin-bottom: 22px;
  }

  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 700px;
  }

  .btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: none;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-primary { background: #4f6ef7; color: #fff; }
  .btn-primary:hover { background: #3a58e0; }
  .btn-ghost {
    background: #fff;
    color: #5a6080;
    border: 1px solid #dde0ea;
  }
  .btn-ghost:hover { background: #f0f2f8; color: #1a1d2e; }
  .btn-ghost.active { color: #4f6ef7; border-color: #4f6ef7; background: #eef1fd; }

  .progress-text {
    font-size: 12px;
    color: #a0a8be;
    font-variant-numeric: tabular-nums;
    min-width: 50px;
    text-align: right;
    margin-left: auto;
  }

  .progress-bar-wrap {
    width: 100%;
    max-width: 700px;
    height: 3px;
    background: #e0e3ed;
    border-radius: 2px;
    margin-bottom: 18px;
  }
  .progress-bar-fill {
    height: 100%;
    background: #4f6ef7;
    border-radius: 2px;
    transition: width 0.3s;
  }

  .card {
    width: min(100%, 700px);
    max-width: 700px;
    height: 340px;
    border-radius: 16px;
    padding: 40px 44px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    transition: box-shadow 0.2s;
    overflow: hidden;
  }
  .card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); }

  .card.front {
    background: #fff;
    border: 1px solid #e0e3ed;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .card.back {
    background: #fff;
    border: 1px solid #e0e3ed;
    justify-content: flex-start;
  }

  .card-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-bottom: 20px;
    flex-shrink: 0;
  }
  .card.front .card-label { color: #4f6ef7; }
  .card.back .card-label { color: #1ab87a; }

  .card-question {
    font-size: 22px;
    font-weight: 600;
    color: #1a1d2e;
    line-height: 1.4;
  }
  .card-filename {
    font-size: 11px;
    color: #c8ccd8;
    margin-top: 18px;
  }

  .card-answer {
    font-size: 14px;
    color: #3a3f58;
    line-height: 1.8;
    overflow-y: auto;
    flex: 1;
  }
  .card-answer::-webkit-scrollbar { width: 4px; }
  .card-answer::-webkit-scrollbar-track { background: transparent; }
  .card-answer::-webkit-scrollbar-thumb { background: #dde0ea; border-radius: 2px; }
  .card-answer h1,
  .card-answer h2,
  .card-answer h3 {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #a0a8be;
    margin: 16px 0 8px;
  }
  .card-answer ul { padding-left: 20px; margin: 8px 0; }
  .card-answer li { margin-bottom: 6px; }
  .card-answer p { margin: 6px 0; }
  .card-answer strong { color: #1a1d2e; }
  .card-answer em { color: #6a72a0; }
  .card-answer code {
    background: #f0f2f8;
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 13px;
    font-family: 'SF Mono', 'Fira Mono', monospace;
    color: #3a3f58;
  }
  .card-answer hr { border: none; border-top: 1px solid #e8eaf0; margin: 12px 0; }

  .nav {
    display: flex;
    gap: 14px;
    margin-top: 18px;
    align-items: center;
  }
  .nav-btn {
    background: #fff;
    border: 1px solid #dde0ea;
    color: #8a90b0;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, color 0.15s, box-shadow 0.15s;
    line-height: 1;
  }
  .nav-btn:hover:not(:disabled) {
    background: #f0f2f8;
    color: #1a1d2e;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .nav-btn:disabled { opacity: 0.25; cursor: default; }

  .hint {
    font-size: 11px;
    color: #c0c4d4;
    margin-top: 14px;
    text-align: center;
  }

  .status {
    font-size: 12px;
    color: #a0a8be;
    margin-top: 6px;
    text-align: center;
    min-height: 18px;
  }
  .status.error { color: #e05a5a; }

  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 260px;
    width: 100%;
    max-width: 700px;
    background: #fff;
    border: 1.5px dashed #dde0ea;
    border-radius: 16px;
    color: #a0a8be;
    text-align: center;
    padding: 40px;
  }
  .empty-icon { font-size: 34px; opacity: 0.5; }
  .empty-title { font-size: 15px; font-weight: 600; color: #6a7090; }
  .empty-sub { font-size: 13px; max-width: 340px; }

  #main { width: 100%; max-width: 700px; }

  /* ---------- folder picker ---------- */

  .picker-overlay {
    position: fixed;
    inset: 0;
    background: rgba(26, 29, 46, 0.32);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }

  .picker {
    background: #fff;
    border-radius: 16px;
    width: min(100%, 460px);
    max-height: min(560px, 86vh);
    display: flex;
    flex-direction: column;
    box-shadow: 0 12px 40px rgba(0,0,0,0.18);
    overflow: hidden;
  }

  .picker-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 18px 20px 12px;
    flex-shrink: 0;
  }
  .picker-title { font-size: 14px; font-weight: 600; color: #1a1d2e; }
  .picker-close {
    margin-left: auto;
    background: none;
    border: none;
    font-size: 20px;
    line-height: 1;
    color: #a0a8be;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 6px;
  }
  .picker-close:hover { background: #f0f2f8; color: #1a1d2e; }

  .picker-crumbs {
    padding: 0 20px 10px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 2px;
    flex-shrink: 0;
  }
  .crumb {
    background: none;
    border: none;
    padding: 2px 4px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 12px;
    color: #4f6ef7;
    cursor: pointer;
  }
  .crumb:hover { background: #eef1fd; }
  .crumb.current { color: #6a7090; cursor: default; }
  .crumb.current:hover { background: none; }
  .crumb-sep { color: #c8ccd8; font-size: 12px; }

  .picker-list {
    flex: 1;
    overflow-y: auto;
    border-top: 1px solid #eef0f6;
    border-bottom: 1px solid #eef0f6;
    padding: 6px 0;
    min-height: 140px;
  }
  .picker-list::-webkit-scrollbar { width: 4px; }
  .picker-list::-webkit-scrollbar-track { background: transparent; }
  .picker-list::-webkit-scrollbar-thumb { background: #dde0ea; border-radius: 2px; }

  .folder-row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 9px 20px;
    background: none;
    border: none;
    font-family: inherit;
    font-size: 13px;
    color: #1a1d2e;
    text-align: left;
    cursor: pointer;
  }
  .folder-row:hover { background: #f4f5f7; }
  .folder-row .chev { margin-left: auto; color: #c8ccd8; font-size: 16px; }

  .picker-note {
    padding: 16px 20px;
    font-size: 12px;
    color: #a0a8be;
    text-align: center;
  }

  .picker-foot {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 20px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .picker-check {
    font-size: 12px;
    color: #6a7090;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-right: auto;
    cursor: pointer;
  }
  .picker-check input { accent-color: #4f6ef7; }
  .btn:disabled { opacity: 0.45; cursor: default; }

  /* Folder buttons: transparent wrapper on desktop, own single line on mobile. */
  .controls-folder { display: contents; }

  @media (max-width: 480px) {
    .controls { gap: 6px; margin-bottom: 14px; }
    .controls-folder {
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      gap: 6px;
      width: 100%;
    }
    .btn { padding: 6px 12px; font-size: 12px; }
    .btn .emoji { display: none; }
  }

  @media (max-width: 420px) {
    .picker-check { flex-basis: 100%; margin-right: 0; margin-bottom: 4px; }
    #picker-cancel { margin-left: auto; }
  }
</style>
</head>
<body>

<h1>MD Flashcards</h1>

<div class="controls">
  <div class="controls-folder">
    <button class="btn btn-ghost" id="load-btn"></button>
    <button class="btn btn-ghost" id="change-folder-btn" style="display:none">Change folder</button>
  </div>
  <button class="btn btn-ghost" id="shuffle-btn" onclick="toggleShuffle()">&#8644; Shuffle</button>
  <button class="btn btn-ghost" id="restart-btn" onclick="restart()" style="display:none">&#8634; Restart</button>
  <span class="progress-text" id="progress-text"></span>
</div>

<div class="progress-bar-wrap" id="progress-bar-wrap" style="display:none">
  <div class="progress-bar-fill" id="progress-bar-fill" style="width:0%"></div>
</div>

<div id="main"></div>

<div class="nav" id="nav" style="display:none">
  <button class="nav-btn" id="prev-btn" onclick="goTo(currentIndex - 1)">&#8249;</button>
  <button class="nav-btn" id="next-btn" onclick="goTo(currentIndex + 1)">&#8250;</button>
</div>

<p class="hint" id="hint"></p>
<p class="status" id="status"></p>

<div class="picker-overlay" id="picker-overlay" style="display:none">
  <div class="picker">
    <div class="picker-head">
      <span class="picker-title">Choose a folder</span>
      <button class="picker-close" id="picker-close" title="Close">&times;</button>
    </div>
    <div class="picker-crumbs" id="picker-crumbs"></div>
    <div class="picker-list" id="picker-list"></div>
    <div class="picker-foot">
      <label class="picker-check">
        <input type="checkbox" id="recurse-check"> Include subfolders
      </label>
      <button class="btn btn-ghost" id="picker-cancel">Cancel</button>
      <button class="btn btn-primary" id="picker-use">Use this folder</button>
    </div>
  </div>
</div>

<script>
  /* ============================================================
     Dropbox OAuth (PKCE, no backend) + folder-based card loading
     ============================================================ */

  var APP_KEY      = 'qrd2zyn6n4hxt6g';
  var REDIRECT_URI = location.origin + location.pathname;
  var SCOPES       = 'files.metadata.read files.content.read';

  var TOKEN_KEY    = 'dbx_token';
  var VERIFIER_KEY = 'dbx_pkce_verifier';
  var STATE_KEY    = 'dbx_pkce_state';

  var MAX_PARALLEL_DOWNLOADS = 6;

  /* ---------- session storage helpers (private mode safe) ---------- */

  function ssGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  function ssSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
  function ssDel(k) { try { sessionStorage.removeItem(k); } catch (e) {} }

  function getToken() { return ssGet(TOKEN_KEY); }

  /* ---------- PKCE helpers ---------- */

  function b64url(bytes) {
    var arr = new Uint8Array(bytes);
    var s = '';
    for (var i = 0; i < arr.length; i++) s += String.fromCharCode(arr[i]);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function randomB64(n) {
    return b64url(crypto.getRandomValues(new Uint8Array(n)));
  }

  function sha256B64url(str) {
    return crypto.subtle
      .digest('SHA-256', new TextEncoder().encode(str))
      .then(function (buf) { return b64url(buf); });
  }

  /* ---------- auth ---------- */

  function startAuth() {
    if (!window.crypto || !crypto.subtle) {
      setStatus('Sign-in needs a secure (https) connection.', true);
      return;
    }
    var verifier = randomB64(64);
    var state = randomB64(16);
    sha256B64url(verifier).then(function (challenge) {
      ssSet(VERIFIER_KEY, verifier);
      ssSet(STATE_KEY, state);
      location.href = 'https://www.dropbox.com/oauth2/authorize'
        + '?client_id=' + encodeURIComponent(APP_KEY)
        + '&response_type=code'
        + '&code_challenge=' + encodeURIComponent(challenge)
        + '&code_challenge_method=S256'
        + '&token_access_type=online'
        + '&scope=' + encodeURIComponent(SCOPES)
        + '&state=' + encodeURIComponent(state)
        + '&redirect_uri=' + encodeURIComponent(REDIRECT_URI);
    });
  }

  // Returns a promise resolving true if we just completed a sign-in.
  function handleAuthRedirect() {
    var params = new URLSearchParams(location.search);
    var code = params.get('code');
    var error = params.get('error');
    var state = params.get('state');

    if (!code && !error) return Promise.resolve(false);

    var expectedState = ssGet(STATE_KEY);
    var verifier = ssGet(VERIFIER_KEY);
    ssDel(STATE_KEY);
    ssDel(VERIFIER_KEY);

    // Strip the OAuth params so a refresh doesn't replay them.
    history.replaceState({}, document.title, REDIRECT_URI);

    if (error) {
      setStatus(error === 'access_denied'
        ? 'Dropbox access was declined.'
        : 'Dropbox authorization failed: ' + error, true);
      return Promise.resolve(false);
    }
    if (!expectedState || state !== expectedState) {
      setStatus('Sign-in could not be verified. Please connect again.', true);
      return Promise.resolve(false);
    }
    if (!verifier) {
      setStatus('Sign-in session was lost. Please connect again.', true);
      return Promise.resolve(false);
    }

    setStatus('Completing sign-in…');
    var body = new URLSearchParams();
    body.set('grant_type', 'authorization_code');
    body.set('code', code);
    body.set('client_id', APP_KEY);
    body.set('code_verifier', verifier);
    body.set('redirect_uri', REDIRECT_URI);

    return fetch('https://api.dropboxapi.com/oauth2/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body.toString()
    })
      .then(function (r) {
        return r.text().then(function (t) {
          if (!r.ok) throw new Error(t || ('HTTP ' + r.status));
          return JSON.parse(t);
        });
      })
      .then(function (data) {
        if (!data.access_token) throw new Error('No access token returned.');
        ssSet(TOKEN_KEY, data.access_token);
        setStatus('');
        return true;
      })
      .catch(function (e) {
        setStatus('Could not complete sign-in: ' + shortErr(e), true);
        return false;
      });
  }

  function signOut() {
    ssDel(TOKEN_KEY);
    cards = [];
    order = [];
    syncLoadButton();
    renderEmpty();
    setStatus('');
  }

  /* ---------- Dropbox API ---------- */

  function apiCheck(res) {
    if (res.status === 401) {
      ssDel(TOKEN_KEY);
      syncLoadButton();
      throw new Error('Your Dropbox session expired — please connect again.');
    }
    if (!res.ok) {
      return res.text().then(function (t) {
        throw new Error(t ? t.slice(0, 200) : ('HTTP ' + res.status));
      });
    }
    return res;
  }

  function rpc(endpoint, args) {
    return fetch('https://api.dropboxapi.com/2/' + endpoint, {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + getToken(),
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(args)
    }).then(apiCheck).then(function (r) { return r.json(); });
  }

  // path '' means the root of the app's Dropbox scope.
  function listFolder(path, recursive) {
    var all = [];
    function step(res) {
      all = all.concat(res.entries || []);
      if (res.has_more) {
        return rpc('files/list_folder/continue', { cursor: res.cursor }).then(step);
      }
      return all;
    }
    return rpc('files/list_folder', {
      path: path,
      recursive: !!recursive,
      include_deleted: false,
      include_media_info: false,
      include_non_downloadable_files: false,
      limit: 2000
    }).then(step);
  }

  // Uses the file id (always ASCII) so the API header stays header-safe
  // even for paths with non-Latin characters.
  function downloadFile(fileId) {
    return fetch('https://content.dropboxapi.com/2/files/download', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + getToken(),
        'Dropbox-API-Arg': JSON.stringify({ path: fileId })
      }
    }).then(apiCheck).then(function (r) { return r.text(); });
  }

  function isMd(entry) {
    return entry['.tag'] === 'file' && /\.md$/i.test(entry.name);
  }

  function byName(a, b) {
    return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
  }

  /* ---------- folder picker ---------- */

  // pickerStack holds the folders we've drilled into: { name, path }.
  // name preserves the display casing; path is the (lowercased) API path.
  var pickerStack = [];
  var pickerPath = '';       // '' = Dropbox root
  var pickerBusy = false;

  function openPicker() {
    if (!getToken()) { startAuth(); return; }
    document.getElementById('picker-overlay').style.display = 'flex';
    navigateTo([]);
  }

  function navigateTo(stack) {
    pickerStack = stack;
    loadPickerPath(stack.length ? stack[stack.length - 1].path : '');
  }

  function closePicker() {
    document.getElementById('picker-overlay').style.display = 'none';
  }

  function pickerOpen() {
    return document.getElementById('picker-overlay').style.display !== 'none';
  }

  function loadPickerPath(path) {
    pickerPath = path;
    pickerBusy = true;
    renderCrumbs();
    document.getElementById('picker-list').innerHTML =
      '<div class="picker-note">Loading…</div>';
    document.getElementById('picker-use').disabled = true;

    listFolder(path, false)
      .then(function (entries) {
        if (pickerPath !== path) return; // a newer navigation won
        pickerBusy = false;
        renderPickerList(entries);
      })
      .catch(function (e) {
        pickerBusy = false;
        document.getElementById('picker-list').innerHTML =
          '<div class="picker-note">' + esc(shortErr(e)) + '</div>';
        if (!getToken()) { closePicker(); setStatus(shortErr(e), true); }
      });
  }

  function renderCrumbs() {
    var wrap = document.getElementById('picker-crumbs');
    wrap.innerHTML = '';

    function crumb(label, depth, isCurrent) {
      var b = document.createElement('button');
      b.className = 'crumb' + (isCurrent ? ' current' : '');
      b.textContent = label;
      if (!isCurrent) {
        b.addEventListener('click', function () { navigateTo(pickerStack.slice(0, depth)); });
      }
      wrap.appendChild(b);
    }
    function sep() {
      var s = document.createElement('span');
      s.className = 'crumb-sep';
      s.textContent = '/';
      wrap.appendChild(s);
    }

    crumb('Dropbox', 0, pickerStack.length === 0);
    for (var i = 0; i < pickerStack.length; i++) {
      sep();
      crumb(pickerStack[i].name, i + 1, i === pickerStack.length - 1);
    }
  }

  function renderPickerList(entries) {
    var list = document.getElementById('picker-list');
    var folders = entries.filter(function (e) { return e['.tag'] === 'folder'; }).sort(byName);
    var mdCount = entries.filter(isMd).length;

    list.innerHTML = '';

    if (!folders.length) {
      var note = document.createElement('div');
      note.className = 'picker-note';
      note.textContent = mdCount
        ? 'No subfolders here.'
        : 'This folder is empty.';
      list.appendChild(note);
    } else {
      folders.forEach(function (f) {
        var row = document.createElement('button');
        row.className = 'folder-row';
        row.innerHTML = '<span>📁</span><span></span><span class="chev">›</span>';
        row.children[1].textContent = f.name;
        row.addEventListener('click', function () {
          navigateTo(pickerStack.concat([{ name: f.name, path: f.path_lower }]));
        });
        list.appendChild(row);
      });
    }

    var useBtn = document.getElementById('picker-use');
    useBtn.disabled = false;
    useBtn.textContent = mdCount
      ? 'Use this folder (' + mdCount + ' .md)'
      : 'Use this folder';
  }

  function useCurrentFolder() {
    if (pickerBusy) return;
    var path = pickerPath;
    var label = pickerStack.length ? pickerStack[pickerStack.length - 1].name : 'Dropbox';
    var recursive = document.getElementById('recurse-check').checked;
    closePicker();
    loadFolderCards(path, recursive, label);
  }

  /* ---------- loading cards from a folder ---------- */

  // Resolves true if cards were loaded (and the folder remembered), false otherwise.
  function loadFolderCards(path, recursive, label) {
    setStatus('Reading ' + label + '…');
    renderEmpty('Reading folder…');

    return listFolder(path, recursive)
      .then(function (entries) {
        var files = entries.filter(isMd).sort(byName);
        if (!files.length) {
          renderEmpty('No .md files found in that folder.');
          setStatus('');
          return false;
        }
        setStatus('Loading ' + files.length + ' card' + (files.length !== 1 ? 's' : '') + '…');
        return fetchAll(files).then(function (results) {
          cards = results.filter(Boolean);
          if (!cards.length) {
            renderEmpty('Could not read any of those files.');
            setStatus('Could not load any cards.', true);
            return false;
          }
          var failed = files.length - cards.length;
          buildOrder();
          currentIndex = 0;
          showCard();
          document.getElementById('restart-btn').style.display = '';
          setStatus(failed ? failed + ' file' + (failed !== 1 ? 's' : '') + ' could not be read.' : '', !!failed);
          saveFolder(path, recursive, label);
          return true;
        });
      })
      .catch(function (e) {
        renderEmpty('Could not open that folder.');
        setStatus(shortErr(e), true);
        return false;
      });
  }

  /* ---------- remembered folder ---------- */

  var FOLDER_PATH_KEY = 'dbx_folder_path';
  var FOLDER_NAME_KEY = 'dbx_folder_name';
  var FOLDER_RECURSE_KEY = 'dbx_folder_recursive';

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  // Note: '' is a valid path (Dropbox root), so test against null.
  function hasSavedFolder() { return lsGet(FOLDER_PATH_KEY) !== null; }

  function saveFolder(path, recursive, label) {
    lsSet(FOLDER_PATH_KEY, path);
    lsSet(FOLDER_NAME_KEY, label);
    lsSet(FOLDER_RECURSE_KEY, recursive ? '1' : '0');
    syncChangeButton();
  }

  function clearSavedFolder() {
    lsDel(FOLDER_PATH_KEY);
    lsDel(FOLDER_NAME_KEY);
    lsDel(FOLDER_RECURSE_KEY);
    syncChangeButton();
  }

  function syncChangeButton() {
    document.getElementById('change-folder-btn').style.display = hasSavedFolder() ? '' : 'none';
  }

  // Loads the remembered folder; falls back to the picker if that fails.
  function autoLoadSavedFolder() {
    var path = lsGet(FOLDER_PATH_KEY);
    var label = lsGet(FOLDER_NAME_KEY) || 'Dropbox';
    var recursive = lsGet(FOLDER_RECURSE_KEY) === '1';
    document.getElementById('recurse-check').checked = recursive;
    loadFolderCards(path, recursive, label).then(function (ok) {
      if (!ok) openPicker();
    });
  }

  function changeFolder() {
    clearSavedFolder();
    openPicker();
  }

  // Downloads with a small concurrency cap so a big folder doesn't
  // fire hundreds of simultaneous requests.
  function fetchAll(files) {
    var results = new Array(files.length);
    var next = 0;
    var done = 0;

    return new Promise(function (resolve) {
      function pump() {
        if (next >= files.length) {
          if (done >= files.length) resolve(results);
          return;
        }
        var i = next++;
        var f = files[i];
        downloadFile(f.id)
          .then(function (text) { results[i] = parseCard(text, f.name); })
          .catch(function () { results[i] = null; })
          .then(function () {
            done++;
            setStatus('Loading ' + done + ' / ' + files.length + '…');
            if (done >= files.length) resolve(results);
            else pump();
          });
      }
      var lanes = Math.min(MAX_PARALLEL_DOWNLOADS, files.length);
      for (var k = 0; k < lanes; k++) pump();
    });
  }

  function shortErr(e) {
    var m = (e && e.message) ? e.message : String(e);
    // Dropbox returns JSON error bodies; surface the useful summary if present.
    try {
      var parsed = JSON.parse(m);
      if (parsed.error_summary) return parsed.error_summary;
    } catch (ignored) {}
    return m;
  }

  /* ============================================================
     Card logic (unchanged)
     ============================================================ */

  var cards = [];
  var order = [];
  var currentIndex = 0;
  var shuffleOn = false;
  var showingAnswer = false;

  function parseCard(text, filename) {
    var raw = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();
    var lines = raw.split('\n');
    var question = '';
    var bodyStart = 0;
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i].trim();
      if (!l) continue;
      question = l.startsWith('#') ? l.replace(/^#+\s*/, '').trim() : l;
      bodyStart = i + 1;
      break;
    }
    var body = lines.slice(bodyStart).join('\n').trim();
    return {
      filename: filename.replace(/\.md$/i, ''),
      question: question || filename.replace(/\.md$/i, ''),
      body: body
    };
  }

  function buildOrder() {
    order = cards.map(function(_, i) { return i; });
    if (shuffleOn) {
      for (var i = order.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = order[i]; order[i] = order[j]; order[j] = t;
      }
    }
  }

  function showCard() {
    showingAnswer = false;
    renderFront();
    updateChrome();
  }

  function renderFront() {
    var card = cards[order[currentIndex]];
    document.getElementById('main').innerHTML =
      '<div class="card front" onclick="showAnswer()">' +
        '<span class="card-label">Question</span>' +
        '<div class="card-question">' + esc(card.question) + '</div>' +
        '<div class="card-filename">' + esc(card.filename) + '</div>' +
      '</div>';
    document.getElementById('hint').textContent = 'Tap to reveal answer  ·  ← → to navigate';
  }

  function showAnswer() {
    showingAnswer = true;
    var card = cards[order[currentIndex]];
    document.getElementById('main').innerHTML =
      '<div class="card back" onclick="showCard()">' +
        '<span class="card-label">Answer</span>' +
        '<div class="card-answer">' + renderMd(card.body) + '</div>' +
      '</div>';
    document.getElementById('hint').textContent = 'Tap to flip back  ·  ← → to navigate';
  }

  function goTo(idx) {
    if (idx < 0 || idx >= cards.length) return;
    currentIndex = idx;
    showCard();
  }

  function updateChrome() {
    var total = cards.length;
    var pct = ((currentIndex + 1) / total * 100).toFixed(1);
    document.getElementById('progress-text').textContent = (currentIndex + 1) + ' / ' + total;
    document.getElementById('progress-bar-wrap').style.display = '';
    document.getElementById('progress-bar-fill').style.width = pct + '%';
    document.getElementById('nav').style.display = 'flex';
    document.getElementById('prev-btn').disabled = currentIndex === 0;
    document.getElementById('next-btn').disabled = currentIndex === total - 1;
  }

  function toggleShuffle() {
    shuffleOn = !shuffleOn;
    document.getElementById('shuffle-btn').classList.toggle('active', shuffleOn);
    if (cards.length) { buildOrder(); currentIndex = 0; showCard(); }
  }

  function restart() {
    buildOrder();
    currentIndex = 0;
    showCard();
  }

  function setStatus(msg, isError) {
    var el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status' + (isError ? ' error' : '');
  }

  function renderMd(text) {
    if (!text) return '<span style="color:#c0c4d4">No answer content.</span>';
    var lines = text.split('\n');
    var out = '';
    var inList = false;
    for (var i = 0; i < lines.length; i++) {
      var trimmed = lines[i].trim();
      var hm = trimmed.match(/^(#{1,3})\s+(.+)$/);
      if (hm) {
        if (inList) { out += '</ul>'; inList = false; }
        var tag = 'h' + hm[1].length;
        out += '<' + tag + '>' + inline(hm[2]) + '</' + tag + '>';
        continue;
      }
      if (/^[-*]{3,}$/.test(trimmed)) {
        if (inList) { out += '</ul>'; inList = false; }
        out += '<hr>';
        continue;
      }
      var bm = trimmed.match(/^[-*]\s+(.+)$/);
      if (bm) {
        if (!inList) { out += '<ul>'; inList = true; }
        out += '<li>' + inline(bm[1]) + '</li>';
        continue;
      }
      if (!trimmed) {
        if (inList) { out += '</ul>'; inList = false; }
        continue;
      }
      if (inList) { out += '</ul>'; inList = false; }
      out += '<p>' + inline(trimmed) + '</p>';
    }
    if (inList) out += '</ul>';
    return out;
  }

  function inline(str) {
    var s = esc(str);
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
    s = s.replace(/`(.+?)`/g, '<code>$1</code>');
    return s;
  }

  function esc(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  document.addEventListener('keydown', function(e) {
    if (pickerOpen()) {
      if (e.key === 'Escape') { e.preventDefault(); closePicker(); }
      return;
    }
    if (!cards.length) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); goTo(currentIndex + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); goTo(currentIndex - 1); }
    else if (e.key === ' ') {
      e.preventDefault();
      if (showingAnswer) showCard(); else showAnswer();
    }
  });

  function renderEmpty(msg) {
    var connected = !!getToken();
    document.getElementById('main').innerHTML =
      '<div class="empty">' +
        '<div class="empty-icon">📂</div>' +
        '<div class="empty-title">' +
          (connected ? 'Pick a folder of cards' : 'Connect your Dropbox') +
        '</div>' +
        '<div class="empty-sub">' + esc(msg || (connected
          ? 'Choose a Dropbox folder. Every .md file inside becomes one card.'
          : 'Sign in to Dropbox, then pick a folder. Every .md file inside becomes one card.')) +
        '</div>' +
      '</div>';
    document.getElementById('progress-bar-wrap').style.display = 'none';
    document.getElementById('nav').style.display = 'none';
    document.getElementById('progress-text').textContent = '';
    document.getElementById('hint').textContent = '';
  }

  /* ---------- wiring ---------- */

  function syncLoadButton() {
    var btn = document.getElementById('load-btn');
    var connected = !!getToken();
    btn.innerHTML = connected ? '<span class="emoji">📂 </span>Choose folder' : 'Connect Dropbox';
    // Connect stays the primary call to action; Choose folder matches Change folder.
    btn.className = 'btn ' + (connected ? 'btn-ghost' : 'btn-primary');
  }

  document.getElementById('load-btn').addEventListener('click', function () {
    if (getToken()) openPicker(); else startAuth();
  });
  document.getElementById('picker-close').addEventListener('click', closePicker);
  document.getElementById('picker-cancel').addEventListener('click', closePicker);
  document.getElementById('picker-use').addEventListener('click', useCurrentFolder);
  document.getElementById('picker-overlay').addEventListener('click', function (e) {
    if (e.target === this) closePicker();
  });

  document.getElementById('change-folder-btn').addEventListener('click', changeFolder);

  syncLoadButton();
  syncChangeButton();
  renderEmpty();

  handleAuthRedirect().then(function (justSignedIn) {
    syncLoadButton();
    renderEmpty();
    if (getToken() && hasSavedFolder()) autoLoadSavedFolder();
    else if (justSignedIn) openPicker();
  });
</script>
</body>
</html>
