<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD Flashcards</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f4f5f7;
    color: #1a1d2e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 20px;
  }

  h1 {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #a0a8be;
    margin-bottom: 22px;
  }

  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 700px;
  }

  .btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: none;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-primary { background: #4f6ef7; color: #fff; }
  .btn-primary:hover { background: #3a58e0; }
  .btn-ghost {
    background: #fff;
    color: #5a6080;
    border: 1px solid #dde0ea;
  }
  .btn-ghost:hover { background: #f0f2f8; color: #1a1d2e; }
  .btn-ghost.active { color: #4f6ef7; border-color: #4f6ef7; background: #eef1fd; }

  .progress-text {
    font-size: 12px;
    color: #a0a8be;
    font-variant-numeric: tabular-nums;
    min-width: 50px;
    text-align: right;
    margin-left: auto;
  }

  .progress-bar-wrap {
    width: 100%;
    max-width: 700px;
    height: 3px;
    background: #e0e3ed;
    border-radius: 2px;
    margin-bottom: 18px;
  }
  .progress-bar-fill {
    height: 100%;
    background: #4f6ef7;
    border-radius: 2px;
    transition: width 0.3s;
  }

  .card {
    width: min(100%, 700px);
    max-width: 700px;
    height: 340px;
    border-radius: 16px;
    padding: 40px 44px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    transition: box-shadow 0.2s;
    overflow: hidden;
  }
  .card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); }

  .card.front {
    background: #fff;
    border: 1px solid #e0e3ed;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .card.back {
    background: #fff;
    border: 1px solid #e0e3ed;
    justify-content: flex-start;
  }

  .card-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .card.front .card-label { color: #4f6ef7; }
  .card.back .card-label { color: #1ab87a; }

  .card-question {
    font-size: 22px;
    font-weight: 600;
    color: #1a1d2e;
    line-height: 1.4;
  }
  .card-filename {
    font-size: 11px;
    color: #c8ccd8;
    margin-top: 18px;
  }

  .card-answer {
    font-size: 14px;
    color: #3a3f58;
    line-height: 1.8;
    overflow-y: auto;
    flex: 1;
  }
  .card-answer::-webkit-scrollbar { width: 4px; }
  .card-answer::-webkit-scrollbar-track { background: transparent; }
  .card-answer::-webkit-scrollbar-thumb { background: #dde0ea; border-radius: 2px; }
  .card-answer h1,
  .card-answer h2,
  .card-answer h3 {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #a0a8be;
    margin: 16px 0 8px;
  }
  .card-answer ul { padding-left: 20px; margin: 8px 0; }
  .card-answer li { margin-bottom: 6px; }
  .card-answer p { margin: 6px 0; }
  .card-answer strong { color: #1a1d2e; }
  .card-answer em { color: #6a72a0; }
  .card-answer code {
    background: #f0f2f8;
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 13px;
    font-family: 'SF Mono', 'Fira Mono', monospace;
    color: #3a3f58;
  }
  .card-answer hr { border: none; border-top: 1px solid #e8eaf0; margin: 12px 0; }

  .nav {
    display: flex;
    gap: 14px;
    margin-top: 18px;
    align-items: center;
  }
  .nav-btn {
    background: #fff;
    border: 1px solid #dde0ea;
    color: #8a90b0;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, color 0.15s, box-shadow 0.15s;
    line-height: 1;
  }
  .nav-btn:hover:not(:disabled) {
    background: #f0f2f8;
    color: #1a1d2e;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .nav-btn:disabled { opacity: 0.25; cursor: default; }

  .hint {
    font-size: 11px;
    color: #c0c4d4;
    margin-top: 14px;
    text-align: center;
  }

  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 260px;
    width: 100%;
    max-width: 700px;
    background: #fff;
    border: 1.5px dashed #dde0ea;
    border-radius: 16px;
    color: #a0a8be;
    text-align: center;
    padding: 40px;
  }
  .empty-icon { font-size: 34px; opacity: 0.5; }
  .empty-title { font-size: 15px; font-weight: 600; color: #6a7090; }
  .empty-sub { font-size: 13px; max-width: 340px; }

  #file-input { display: none; }
  #main { width: 100%; max-width: 700px; }
</style>
</head>
<body>

<h1>MD Flashcards</h1>

<div class="controls">
  <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">📄 Load Cards</button>
  <input type="file" id="file-input" multiple accept=".md">
  <button class="btn btn-ghost" id="shuffle-btn" onclick="toggleShuffle()">⇄ Shuffle</button>
  <button class="btn btn-ghost" id="restart-btn" onclick="restart()" style="display:none">↺ Restart</button>
  <span class="progress-text" id="progress-text"></span>
</div>

<div class="progress-bar-wrap" id="progress-bar-wrap" style="display:none">
  <div class="progress-bar-fill" id="progress-bar-fill" style="width:0%"></div>
</div>

<div id="main"></div>

<div class="nav" id="nav" style="display:none">
  <button class="nav-btn" id="prev-btn" onclick="goTo(currentIndex - 1)">&#8249;</button>
  <button class="nav-btn" id="next-btn" onclick="goTo(currentIndex + 1)">&#8250;</button>
</div>

<p class="hint" id="hint"></p>

<script>
  var cards = [];
  var order = [];
  var currentIndex = 0;
  var shuffleOn = false;
  var showingAnswer = false;

  document.getElementById('file-input').addEventListener('change', function(e) {
    var files = Array.from(e.target.files).filter(function(f) {
      return f.name.toLowerCase().endsWith('.md');
    });
    if (!files.length) { renderEmpty('No .md files found.'); return; }
    Promise.all(files.map(readFile)).then(function(results) {
      cards = results.filter(Boolean);
      if (!cards.length) { renderEmpty('Could not parse any cards.'); return; }
      buildOrder();
      currentIndex = 0;
      showCard();
      document.getElementById('restart-btn').style.display = '';
    });
    e.target.value = '';
  });

  function readFile(file) {
    return new Promise(function(resolve) {
      var reader = new FileReader();
      reader.onload = function(ev) {
        var raw = ev.target.result || '';
        var text = raw.replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();
        var lines = text.split('\n');
        var question = '';
        var bodyStart = 0;
        for (var i = 0; i < lines.length; i++) {
          var l = lines[i].trim();
          if (!l) continue;
          if (l.startsWith('#')) {
            question = l.replace(/^#+\s*/, '').trim();
          } else {
            question = l;
          }
          bodyStart = i + 1;
          break;
        }
        var body = lines.slice(bodyStart).join('\n').trim();
        resolve({
          filename: file.name.replace(/\.md$/i, ''),
          question: question || file.name.replace(/\.md$/i, ''),
          body: body
        });
      };
      reader.onerror = function() { resolve(null); };
      reader.readAsText(file);
    });
  }

  function buildOrder() {
    order = cards.map(function(_, i) { return i; });
    if (shuffleOn) {
      for (var i = order.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = order[i]; order[i] = order[j]; order[j] = t;
      }
    }
  }

  function showCard() {
    showingAnswer = false;
    renderFront();
    updateChrome();
  }

  function renderFront() {
    var card = cards[order[currentIndex]];
    document.getElementById('main').innerHTML =
      '<div class="card front" onclick="showAnswer()">' +
        '<span class="card-label">Question</span>' +
        '<div class="card-question">' + esc(card.question) + '</div>' +
        '<div class="card-filename">' + esc(card.filename) + '</div>' +
      '</div>';
    document.getElementById('hint').textContent = 'Click to reveal answer  \u00b7  Space  \u00b7  \u2190 \u2192 to navigate';
  }

  function showAnswer() {
    showingAnswer = true;
    var card = cards[order[currentIndex]];
    document.getElementById('main').innerHTML =
      '<div class="card back" onclick="showCard()">' +
        '<span class="card-label">Answer</span>' +
        '<div class="card-answer">' + renderMd(card.body) + '</div>' +
      '</div>';
    document.getElementById('hint').textContent = 'Click to flip back  \u00b7  \u2190 \u2192 to navigate';
  }

  function goTo(idx) {
    if (idx < 0 || idx >= cards.length) return;
    currentIndex = idx;
    showCard();
  }

  function updateChrome() {
    var total = cards.length;
    var pct = ((currentIndex + 1) / total * 100).toFixed(1);
    document.getElementById('progress-text').textContent = (currentIndex + 1) + ' / ' + total;
    document.getElementById('progress-bar-wrap').style.display = '';
    document.getElementById('progress-bar-fill').style.width = pct + '%';
    document.getElementById('nav').style.display = 'flex';
    document.getElementById('prev-btn').disabled = currentIndex === 0;
    document.getElementById('next-btn').disabled = currentIndex === total - 1;
  }

  function toggleShuffle() {
    shuffleOn = !shuffleOn;
    document.getElementById('shuffle-btn').classList.toggle('active', shuffleOn);
    if (cards.length) { buildOrder(); currentIndex = 0; showCard(); }
  }

  function restart() {
    buildOrder();
    currentIndex = 0;
    showCard();
  }

  function renderMd(text) {
    if (!text) return '<span style="color:#c0c4d4">No answer content.</span>';
    var lines = text.split('\n');
    var out = '';
    var inList = false;
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var trimmed = line.trim();
      var hm = trimmed.match(/^(#{1,3})\s+(.+)$/);
      if (hm) {
        if (inList) { out += '</ul>'; inList = false; }
        var tag = 'h' + hm[1].length;
        out += '<' + tag + '>' + inline(hm[2]) + '</' + tag + '>';
        continue;
      }
      if (/^[-*]{3,}$/.test(trimmed)) {
        if (inList) { out += '</ul>'; inList = false; }
        out += '<hr>';
        continue;
      }
      var bm = trimmed.match(/^[-*]\s+(.+)$/);
      if (bm) {
        if (!inList) { out += '<ul>'; inList = true; }
        out += '<li>' + inline(bm[1]) + '</li>';
        continue;
      }
      if (!trimmed) {
        if (inList) { out += '</ul>'; inList = false; }
        continue;
      }
      if (inList) { out += '</ul>'; inList = false; }
      out += '<p>' + inline(trimmed) + '</p>';
    }
    if (inList) out += '</ul>';
    return out;
  }

  function inline(str) {
    var s = esc(str);
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
    s = s.replace(/`(.+?)`/g, '<code>$1</code>');
    return s;
  }

  function esc(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  document.addEventListener('keydown', function(e) {
    if (!cards.length) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); goTo(currentIndex + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); goTo(currentIndex - 1); }
    else if (e.key === ' ') {
      e.preventDefault();
      if (showingAnswer) showCard(); else showAnswer();
    }
  });

  renderEmpty();

  function renderEmpty(msg) {
    document.getElementById('main').innerHTML =
      '<div class="empty">' +
        '<div class="empty-icon">\uD83D\uDCC2</div>' +
        '<div class="empty-title">Load a folder of .md files</div>' +
        '<div class="empty-sub">' + esc(msg || 'Each file = one card. First heading or line = question. Rest = answer.') + '</div>' +
      '</div>';
    document.getElementById('progress-bar-wrap').style.display = 'none';
    document.getElementById('nav').style.display = 'none';
    document.getElementById('progress-text').textContent = '';
    document.getElementById('hint').textContent = '';
  }
</script>
</body>
</html>
